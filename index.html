<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autoatendimento SENAI</title>
    <link rel="stylesheet" href="style.css?v=4">
</head>

<body>

    <div class="app-container">

        <main class="screen login-screen">

            <!-- PARTE SUPERIOR -->
            <div class="top-section">
                <img
                    src="senai-logo.png"
                    alt="Logo SENAI"
                    class="senai-logo"
                >
                <p>
                    Entre com seu e-mail para acessar a cantina.
                </p>
            </div>

            <!-- PARTE INFERIOR -->
            <div class="bottom-section">

                <div class="admin-form">
                    <!-- E-MAIL DO ALUNO -->
                    <input
                        type="email"
                        id="aluno-login-email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                    >

                    <!-- BOTÃO ENTRAR -->
                    <button
                        type="button"
                        id="btn-login-aluno"
                        class="btn-entrar-adm"
                    >
                        ENTRAR
                    </button>

                    <!-- BOTÃO CRIAR CADASTRO -->
                    <button
                        type="button"
                        class="btn-cadastro"
                        onclick="window.location.href='cadastro.html'"
                    >
                        CRIAR CADASTRO
                    </button>
                </div>

                <!-- ACESSO DO ADMINISTRADOR -->
                <div class="footer-btn">
                    <button
                        type="button"
                        class="btn-voltar"
                        onclick="window.location.href='loginADM.html'"
                    >
                        ACESSO DA CANTINA
                    </button>
                </div>

            </div>

        </main>

    </div>

    <!-- SCRIPT PRINCIPAL -->
    <script src="script.js?v=4"></script>

</body>

</html>

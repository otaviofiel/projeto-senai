<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - SENAI</title>
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body class="bg-light">

    <div class="app-container menu-container">
        
        <header class="top-header">
            <img src="senai-logo.png" alt="Logo SENAI" class="header-logo">
        </header>

        <main class="menu-content">
            
            <section class="top-categories">
                <div class="promo-banner">
                    <div class="banner-content">
                        <h3>PAGAMENTO</h3>
                        <p>PIX ou CARTÃO 💳</p>
                    </div>
                </div>

              
            </section>

            <section class="bestsellers-section">
                <h2 class="section-title">Mais pedidos</h2>
                
                <div class="products-grid" id="lista-produtos">
                    <p style="text-align: center; width: 100%; color: #666;">Carregando cardápio...</p>
                </div>
            </section>

        </main>

        <nav class="bottom-nav">
            <button class="nav-item active">🏠</button>
            <button class="nav-item">🔍</button>
            <button class="nav-item cart-btn">
                🛒 <span class="cart-badge">0</span>
            </button>
        </nav>

    </div>

    <script src="script.js?v=3"></script>

</body>
</html>

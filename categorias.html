<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias • Cantina SENAI FilaZero</title>
    <link rel="stylesheet" href="style.css?v=6">
</head>

<body class="bg-light">

    <div class="app-container menu-container">

        <header class="top-header header-com-voltar">
            <button type="button" class="btn-voltar-header" onclick="window.location.href='index.html'"
                title="Voltar ao Dashboard">🏠</button>
            <img src="senai-logo.png" alt="Logo SENAI" class="header-logo senai-logo"
                onclick="window.location.href='index.html'" style="cursor: pointer;" title="Ir para o Dashboard">
            <button type="button" class="btn-voltar-header" onclick="window.location.href='carrinho.html'"
                style="left: auto; right: 20px;" title="Ver Carrinho">
                🛒 <span class="cart-badge" style="font-size: 11px; margin-left: 2px;">0</span>
            </button>
        </header>

        <main class="menu-content">

            <div class="search-bar-container">
                <span class="icon">🔍</span>
                <input type="text" placeholder="Buscar por lanche, bebida ou categoria (Pressione Enter)..."
                    onkeypress="if(event.key === 'Enter') window.location.href='menu.html?busca=' + encodeURIComponent(this.value)">
            </div>

            <h2 class="section-title">Categorias do Cardápio</h2>

            <div class="categories-grid-page">

                <div class="category-card-large" onclick="window.location.href='menu.html?cat=salgados'"
                    style="cursor: pointer;">
                    <img src="https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?w=400&q=80"
                        alt="Salgados Fritos">
                    <h3>Salgados Fritos</h3>
                </div>

                <div class="category-card-large" onclick="window.location.href='menu.html?cat=salgados'"
                    style="cursor: pointer;">
                    <img src="https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=400&q=80"
                        alt="Salgados Assados">
                    <h3>Salgados Assados</h3>
                </div>

                <div class="category-card-large" onclick="window.location.href='menu.html?cat=bebidas'"
                    style="cursor: pointer;">
                    <img src="https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=400&q=80"
                        alt="Refrigerantes">
                    <h3>Refrigerantes</h3>
                </div>

                <div class="category-card-large" onclick="window.location.href='menu.html?cat=bebidas'"
                    style="cursor: pointer;">
                    <img src="https://images.unsplash.com/photo-1613478223719-2ab802602423?w=400&q=80"
                        alt="Sucos Naturais">
                    <h3>Sucos Naturais</h3>
                </div>

                <div class="category-card-large" onclick="window.location.href='menu.html?cat=doces'"
                    style="cursor: pointer;">
                    <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=400&q=80"
                        alt="Sobremesas e Doces">
                    <h3>Doces & Sobremesas</h3>
                </div>

                <div class="category-card-large" onclick="window.location.href='menu.html?cat=lanches'"
                    style="cursor: pointer;">
                    <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400&q=80"
                        alt="Lanches & Sanduíches">
                    <h3>Lanches & Sanduíches</h3>
                </div>

            </div>

        </main>

        <nav class="bottom-nav">
            <button class="nav-item" onclick="window.location.href='menu.html'" title="Cardápio">🍽️</button>
            <button class="nav-item active" onclick="window.location.href='categorias.html'"
                title="Categorias">🏷️</button>
            <button class="nav-item" onclick="window.location.href='index.html'" title="Início / Dashboard">🏠</button>
            <button class="nav-item cart-btn" onclick="window.location.href='carrinho.html'" title="Carrinho">
                🛒 <span class="cart-badge">0</span>
            </button>
        </nav>

    </div>

    <script src="script.js?v=11"></script>
</body>

</html>
